<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="#0B0F19"/>
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#1E293B" stroke-width="2"/>
  <!-- Logic symbol glyph: p -> q styled with cyan & indigo gradient -->
  <defs>
    <linearGradient id="lsGrad" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- L shaped bracket / arrow -->
  <path d="M14 13V31C14 33.2091 15.7909 35 18 35H34" stroke="url(#lsGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow tip for implication -->
  <path d="M29 30L34 35L29 40" stroke="url(#lsGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot / proposition node p -->
  <circle cx="14" cy="13" r="3" fill="#00D2FF"/>
  <!-- S symbolic node -->
  <path d="M23 15C23 13.5 25 12 27.5 12C30 12 32 13.5 32 15C32 17.5 24 18 24 20.5C24 22 26 23 28.5 23C31 23 33 21.8 33 21" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
</svg>